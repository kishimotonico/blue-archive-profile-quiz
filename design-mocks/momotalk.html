<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>ピーチトーク風クイズモック</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --pink: #fb8aac;
    --pink-dark: #f86a8e;
    --pink-light: #ffc1d4;
    --bg: #fdf8f9;
    --gray-dark: #4c5b70;
    --gray-darker: #3c4a5e;
    --accent-red: #ff4471;
    --bubble-border: #ececec;
    --text-main: #3a3a3a;
    --radius-bubble: 18px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    color: var(--text-main);
    background: linear-gradient(180deg, #f3e2e8 0%, #eae0e6 100%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 0;
  }

  @media (min-width: 640px) {
    body {
      padding: 32px 16px;
    }
  }

  .phone-frame {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  @media (min-width: 640px) {
    .phone-frame {
      min-height: 800px;
      height: 800px;
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(76, 40, 55, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
  }

  /* ---------- app bar ---------- */
  .app-bar {
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-dark) 100%);
    color: #fff;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(248, 106, 142, 0.35);
    z-index: 2;
  }

  .peach-icon {
    width: 26px;
    height: 26px;
    position: relative;
    flex-shrink: 0;
  }
  .peach-icon::before,
  .peach-icon::after {
    content: "";
    position: absolute;
    border-radius: 50% 50% 50% 50%;
    background: linear-gradient(160deg, #ffd7e2 0%, #ff9fbb 60%, #ff7ea0 100%);
    box-shadow: inset -2px -3px 4px rgba(214, 84, 120, 0.4);
  }
  .peach-icon::before {
    width: 15px;
    height: 20px;
    left: 0;
    top: 4px;
    border-radius: 50% 60% 60% 55%;
  }
  .peach-icon::after {
    width: 15px;
    height: 20px;
    right: 0;
    top: 4px;
    border-radius: 60% 50% 55% 60%;
  }
  .peach-icon .leaf {
    position: absolute;
    top: -2px;
    left: 11px;
    width: 10px;
    height: 6px;
    background: #7bc47f;
    border-radius: 0 100% 0 100%;
    transform: rotate(-10deg);
  }

  .app-bar__title {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 0.02em;
    flex-grow: 1;
  }

  .app-bar__icons {
    display: flex;
    gap: 14px;
    font-size: 18px;
    opacity: 0.95;
  }

  /* ---------- partner row ---------- */
  .partner-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: #fff;
    border-bottom: 1px solid #f5e3e8;
    flex-shrink: 0;
    transition: background 0.4s ease;
  }
  .partner-row.is-revealed {
    background: linear-gradient(90deg, #fff6f8 0%, #ffffff 60%);
  }

  .partner-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
    background: linear-gradient(150deg, #b9c2d0 0%, #7c8aa0 100%);
    color: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    transition: background 0.5s ease, transform 0.4s ease;
  }
  .partner-avatar.is-revealed {
    background: linear-gradient(150deg, #ffe4ac 0%, #ffb0c8 55%, #8fb8ff 100%);
    transform: scale(1.05);
  }

  .partner-meta {
    display: flex;
    flex-direction: column;
    line-height: 1.3;
  }
  .partner-name {
    font-weight: 700;
    font-size: 15px;
    transition: color 0.3s ease;
  }
  .partner-name.is-revealed {
    color: var(--pink-dark);
  }
  .partner-sub {
    font-size: 11px;
    color: #9aa3af;
  }

  /* ---------- messages ---------- */
  .messages {
    flex-grow: 1;
    overflow-y: auto;
    padding: 14px 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background-image: radial-gradient(circle at 20% 10%, #fff0f4 0%, transparent 45%),
      radial-gradient(circle at 90% 80%, #fff3f7 0%, transparent 40%);
    scroll-behavior: smooth;
  }

  .msg-date {
    align-self: center;
    font-size: 11px;
    color: #b6bcc4;
    background: #f1eef0;
    padding: 3px 12px;
    border-radius: 999px;
    margin-bottom: 4px;
  }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    max-width: 100%;
  }
  .msg-row--bot {
    justify-content: flex-start;
  }
  .msg-row--user {
    justify-content: flex-end;
  }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    background: linear-gradient(150deg, #b9c2d0 0%, #7c8aa0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: #fff;
    transition: background 0.5s ease;
  }
  .msg-avatar.is-revealed {
    background: linear-gradient(150deg, #ffe4ac 0%, #ffb0c8 55%, #8fb8ff 100%);
  }

  .bubble {
    max-width: 74%;
    padding: 9px 13px;
    font-size: 14px;
    line-height: 1.55;
    border-radius: var(--radius-bubble);
    word-break: break-word;
    animation: pop-in 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }

  .bubble--bot {
    background: #fff;
    border: 1px solid var(--bubble-border);
    color: var(--text-main);
    border-bottom-left-radius: 5px;
  }

  .bubble--user {
    background: var(--gray-dark);
    color: #fff;
    border-bottom-right-radius: 5px;
  }

  .bubble--hint {
    background: #fff;
    border: 1px solid var(--pink-light);
    border-bottom-left-radius: 5px;
    padding: 10px 12px;
    min-width: 180px;
  }
  .hint-card__label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--pink-dark);
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 3px;
  }
  .hint-card__value {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-main);
  }
  .hint-card__index {
    font-size: 10px;
    color: #c3cad2;
    margin-top: 4px;
    text-align: right;
  }

  .bubble--silhouette {
    background: #fff;
    border: 1px solid var(--pink-light);
    border-bottom-left-radius: 5px;
    padding: 10px;
  }
  .silhouette-box {
    width: 140px;
    height: 170px;
    border-radius: 12px;
    background: linear-gradient(160deg, #2c3446 0%, #1c212c 100%);
    position: relative;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .silhouette-shape {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 92px;
    height: 150px;
    background: #05070c;
    border-radius: 46px 46px 20px 20px / 55px 55px 20px 20px;
  }
  .silhouette-shape::before {
    content: "";
    position: absolute;
    top: -34px;
    left: 50%;
    transform: translateX(-50%);
    width: 58px;
    height: 58px;
    background: #05070c;
    border-radius: 50%;
  }
  .silhouette-caption {
    font-size: 11px;
    color: #9aa3af;
    text-align: center;
  }

  .timestamp {
    font-size: 10px;
    color: #c3cad2;
    align-self: flex-end;
    margin: 0 2px 2px;
    white-space: nowrap;
  }

  .msg-row--user .timestamp {
    order: -1;
  }

  /* typing indicator */
  .typing-bubble {
    background: #fff;
    border: 1px solid var(--bubble-border);
    border-radius: var(--radius-bubble);
    border-bottom-left-radius: 5px;
    padding: 12px 16px;
    display: flex;
    gap: 4px;
    align-items: center;
    width: fit-content;
  }
  .typing-bubble span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c7cdd4;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-bubble span:nth-child(2) {
    animation-delay: 0.15s;
  }
  .typing-bubble span:nth-child(3) {
    animation-delay: 0.3s;
  }

  @keyframes bounce {
    0%,
    60%,
    100% {
      transform: translateY(0);
      opacity: 0.6;
    }
    30% {
      transform: translateY(-5px);
      opacity: 1;
    }
  }

  @keyframes pop-in {
    0% {
      opacity: 0;
      transform: scale(0.85) translateY(6px);
    }
    100% {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  /* result card */
  .result-card {
    background: linear-gradient(160deg, #fff 0%, #fff5f8 100%);
    border: 1.5px solid var(--pink-light);
    border-radius: 16px;
    padding: 14px 16px;
    max-width: 78%;
    box-shadow: 0 4px 14px rgba(251, 138, 172, 0.25);
    animation: pop-in 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  .result-card__title {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 800;
    color: var(--pink-dark);
    font-size: 16px;
    margin-bottom: 4px;
  }
  .result-card__score {
    font-size: 28px;
    font-weight: 900;
    color: var(--accent-red);
    line-height: 1;
    margin: 6px 0;
  }
  .result-card__score span {
    font-size: 14px;
    color: var(--text-main);
    font-weight: 700;
    margin-left: 3px;
  }
  .result-card__desc {
    font-size: 12px;
    color: #8a8f96;
  }

  /* heart reaction burst */
  .heart-burst {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    overflow: hidden;
  }
  .heart-particle {
    position: absolute;
    font-size: 22px;
    opacity: 0;
    animation: heart-fly 1.6s ease-out forwards;
  }
  @keyframes heart-fly {
    0% {
      opacity: 0;
      transform: translateY(0) scale(0.5) rotate(0deg);
    }
    15% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: translateY(-220px) scale(1.15) rotate(20deg);
    }
  }

  /* ---------- footer / composer ---------- */
  .footer {
    flex-shrink: 0;
    background: #fff;
    border-top: 1px solid #f2e6ea;
    padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .quick-actions {
    display: flex;
    gap: 8px;
    overflow-x: auto;
  }

  .hint-btn {
    border: none;
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-dark) 100%);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 3px 8px rgba(248, 106, 142, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
  }
  .hint-btn:hover:not(:disabled) {
    transform: translateY(-1px);
  }
  .hint-btn:active:not(:disabled) {
    transform: translateY(0) scale(0.97);
  }
  .hint-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }

  .restart-btn {
    border: none;
    background: var(--gray-dark);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    display: none;
  }
  .restart-btn.is-visible {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .composer {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .composer input[type="text"] {
    flex-grow: 1;
    border: 1.5px solid #eee1e6;
    background: #faf6f7;
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text-main);
    outline-offset: 2px;
  }
  .composer input[type="text"]:focus-visible {
    outline: 2px solid var(--pink-dark);
    border-color: var(--pink-dark);
  }
  .composer input[type="text"]:disabled {
    opacity: 0.6;
  }

  .send-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--gray-dark);
    color: #fff;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .send-btn:hover:not(:disabled) {
    background: var(--gray-darker);
  }
  .send-btn:active:not(:disabled) {
    transform: scale(0.92);
  }
  .send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .send-btn:focus-visible,
  .hint-btn:focus-visible,
  .restart-btn:focus-visible {
    outline: 2px solid var(--pink-dark);
    outline-offset: 2px;
  }

  .hint-progress {
    font-size: 11px;
    color: #b3b9c1;
    align-self: center;
    white-space: nowrap;
    padding: 0 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<div class="phone-frame">
  <header class="app-bar">
    <div class="peach-icon"><span class="leaf"></span></div>
    <div class="app-bar__title">ピーチトーク</div>
    <div class="app-bar__icons" aria-hidden="true">
      <span>🔍</span>
      <span>☰</span>
    </div>
  </header>

  <div class="partner-row" id="partnerRow">
    <div class="partner-avatar" id="partnerAvatar">❔</div>
    <div class="partner-meta">
      <div class="partner-name" id="partnerName">？？？</div>
      <div class="partner-sub" id="partnerSub">正体不明の生徒</div>
    </div>
  </div>

  <main class="messages" id="messages" aria-live="polite">
    <div class="msg-date">今日のクイズ</div>

    <div class="msg-row msg-row--bot">
      <div class="msg-avatar" id="avatar-intro">❔</div>
      <div class="bubble bubble--bot">
        先生、こんにちは！わたしが誰か、当ててみて〜！<br />下の「ヒントをもらう」をタップしてね。
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="quick-actions">
      <button class="hint-btn" id="hintBtn" type="button">
        💬 ヒントをもらう <span id="hintCount">(0/9)</span>
      </button>
      <button class="restart-btn" id="restartBtn" type="button">🔄 もう一度あそぶ</button>
      <div class="hint-progress" id="hintProgress"></div>
    </div>
    <form class="composer" id="composerForm">
      <input
        type="text"
        id="answerInput"
        placeholder="生徒の名前を入力…"
        autocomplete="off"
        aria-label="回答を入力"
      />
      <button class="send-btn" id="sendBtn" type="submit" aria-label="送信">➤</button>
    </form>
  </footer>
</div>

<script>
  (function () {
    const hints = [
      { icon: "🏫", label: "学園", value: "アビドス高等学校（3年生）" },
      { icon: "⚔️", label: "部活", value: "対策委員会" },
      { icon: "🎂", label: "年齢", value: "17歳" },
      { icon: "🎉", label: "誕生日", value: "1月2日" },
      { icon: "📏", label: "身長", value: "145cm" },
      { icon: "☺️", label: "趣味", value: "昼寝、ゴロゴロすること" },
      { icon: "🗡️", label: "武器", value: "Eye of Horus" },
      { icon: "🎙️", label: "CV", value: "花守ゆみり" },
      { icon: "🈹", label: "姓", value: "小鳥遊" },
    ];
    const CORRECT_ANSWERS = ["ホシノ", "小鳥遊ホシノ", "こばとほしの", "ほしの"];

    const messagesEl = document.getElementById("messages");
    const hintBtn = document.getElementById("hintBtn");
    const restartBtn = document.getElementById("restartBtn");
    const hintCountEl = document.getElementById("hintCount");
    const hintProgressEl = document.getElementById("hintProgress");
    const answerInput = document.getElementById("answerInput");
    const composerForm = document.getElementById("composerForm");
    const sendBtn = document.getElementById("sendBtn");
    const partnerAvatar = document.getElementById("partnerAvatar");
    const partnerName = document.getElementById("partnerName");
    const partnerSub = document.getElementById("partnerSub");
    const partnerRow = document.getElementById("partnerRow");

    let revealedCount = 0; // 0..9 normal hints, 10 = silhouette shown
    let answered = false;
    let busy = false;

    function now() {
      const d = new Date();
      return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addBotTextBubble(text) {
      const row = document.createElement("div");
      row.className = "msg-row msg-row--bot";
      row.innerHTML =
        '<div class="msg-avatar' +
        (answered ? " is-revealed" : "") +
        '">' +
        (answered ? "⭐" : "❔") +
        '</div><div class="bubble bubble--bot"></div><div class="timestamp">' +
        now() +
        "</div>";
      row.querySelector(".bubble").textContent = text;
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function addHintBubble(hint, index) {
      const row = document.createElement("div");
      row.className = "msg-row msg-row--bot";
      row.innerHTML =
        '<div class="msg-avatar">❔</div>' +
        '<div class="bubble bubble--hint">' +
        '<div class="hint-card__label">' +
        hint.icon +
        " " +
        escapeHtml(hint.label) +
        "</div>" +
        '<div class="hint-card__value">' +
        escapeHtml(hint.value) +
        "</div>" +
        '<div class="hint-card__index">ヒント ' +
        index +
        " / 9・的中で" +
        (11 - index) +
        "点</div>" +
        "</div>" +
        '<div class="timestamp">' +
        now() +
        "</div>";
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function addSilhouetteBubble() {
      const row = document.createElement("div");
      row.className = "msg-row msg-row--bot";
      row.innerHTML =
        '<div class="msg-avatar">❔</div>' +
        '<div class="bubble bubble--silhouette">' +
        '<div class="silhouette-box"><div class="silhouette-shape"></div></div>' +
        '<div class="silhouette-caption">最後のヒント…わたしのシルエットだよ！</div>' +
        "</div>" +
        '<div class="timestamp">' +
        now() +
        "</div>";
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function addUserBubble(text) {
      const row = document.createElement("div");
      row.className = "msg-row msg-row--user";
      row.innerHTML =
        '<div class="timestamp">' + now() + "</div>" + '<div class="bubble bubble--user"></div>';
      row.querySelector(".bubble").textContent = text;
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function addResultCard(score) {
      const row = document.createElement("div");
      row.className = "msg-row msg-row--bot";
      row.innerHTML =
        '<div class="msg-avatar is-revealed">⭐</div>' +
        '<div class="result-card">' +
        '<div class="result-card__title">🎉 正解！</div>' +
        '<div class="result-card__score">' +
        score +
        '<span>/ 10点</span></div>' +
        '<div class="result-card__desc">正体は小鳥遊ホシノでした。またチャレンジしてね！</div>' +
        "</div>";
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function showTyping() {
      const row = document.createElement("div");
      row.className = "msg-row msg-row--bot";
      row.id = "typingRow";
      row.innerHTML =
        '<div class="msg-avatar' +
        (answered ? " is-revealed" : "") +
        '">' +
        (answered ? "⭐" : "❔") +
        '</div><div class="typing-bubble"><span></span><span></span><span></span></div>';
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function hideTyping() {
      const row = document.getElementById("typingRow");
      if (row) row.remove();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function updateHintUi() {
      hintCountEl.textContent = "(" + Math.min(revealedCount, 9) + "/9)";
      if (revealedCount >= 10) {
        hintBtn.disabled = true;
        hintProgressEl.textContent = "ヒントは全部見せちゃった…";
      } else if (revealedCount >= 9) {
        hintProgressEl.textContent = "次はシルエット公開！";
      } else {
        hintProgressEl.textContent = "";
      }
    }

    function requestHint() {
      if (busy || answered || revealedCount >= 10) return;
      busy = true;
      hintBtn.disabled = true;
      showTyping();
      setTimeout(function () {
        hideTyping();
        if (revealedCount < 9) {
          revealedCount += 1;
          addHintBubble(hints[revealedCount - 1], revealedCount);
        } else {
          revealedCount = 10;
          addSilhouetteBubble();
        }
        updateHintUi();
        busy = false;
        if (!answered && revealedCount < 10) hintBtn.disabled = false;
      }, 850);
    }

    function currentScore() {
      if (revealedCount >= 10) return 1;
      if (revealedCount <= 0) return 10;
      return 11 - revealedCount;
    }

    function normalize(str) {
      return str.trim().replace(/\s+/g, "").toLowerCase();
    }

    function triggerHeartBurst() {
      const layer = document.createElement("div");
      layer.className = "heart-burst";
      document.body.appendChild(layer);
      const rect = partnerAvatar.getBoundingClientRect();
      for (let i = 0; i < 10; i++) {
        const heart = document.createElement("div");
        heart.className = "heart-particle";
        heart.textContent = i % 2 === 0 ? "💗" : "✨";
        heart.style.left = rect.left + rect.width / 2 + (Math.random() * 60 - 30) + "px";
        heart.style.top = rect.top + "px";
        heart.style.animationDelay = i * 0.06 + "s";
        layer.appendChild(heart);
      }
      setTimeout(function () {
        layer.remove();
      }, 2000);
    }

    function revealHoshino() {
      partnerAvatar.classList.add("is-revealed");
      partnerAvatar.textContent = "⭐";
      partnerName.classList.add("is-revealed");
      partnerName.textContent = "小鳥遊ホシノ";
      partnerSub.textContent = "アビドス高等学校・対策委員会";
      partnerRow.classList.add("is-revealed");
      document.getElementById("avatar-intro").classList.add("is-revealed");
      document.getElementById("avatar-intro").textContent = "⭐";
      triggerHeartBurst();
    }

    function handleAnswer(text) {
      if (answered || busy) return;
      addUserBubble(text);
      answerInput.value = "";
      const normalizedAnswers = CORRECT_ANSWERS.map(normalize);
      if (normalizedAnswers.indexOf(normalize(text)) !== -1) {
        answered = true;
        busy = true;
        hintBtn.disabled = true;
        showTyping();
        setTimeout(function () {
          hideTyping();
          revealHoshino();
          const score = currentScore();
          addResultCard(score);
          answerInput.disabled = true;
          sendBtn.disabled = true;
          restartBtn.classList.add("is-visible");
          busy = false;
        }, 700);
      } else {
        busy = true;
        showTyping();
        setTimeout(function () {
          hideTyping();
          addBotTextBubble("うーん、ちがうみたい…！もう少しヒントを見てみる？");
          busy = false;
        }, 650);
      }
    }

    function resetQuiz() {
      revealedCount = 0;
      answered = false;
      busy = false;
      messagesEl.innerHTML =
        '<div class="msg-date">今日のクイズ</div><div class="msg-row msg-row--bot"><div class="msg-avatar" id="avatar-intro">❔</div><div class="bubble bubble--bot">先生、こんにちは！わたしが誰か、当ててみて〜！<br>下の「ヒントをもらう」をタップしてね。</div></div>';
      partnerAvatar.classList.remove("is-revealed");
      partnerAvatar.textContent = "❔";
      partnerName.classList.remove("is-revealed");
      partnerName.textContent = "？？？";
      partnerSub.textContent = "正体不明の生徒";
      partnerRow.classList.remove("is-revealed");
      answerInput.disabled = false;
      sendBtn.disabled = false;
      hintBtn.disabled = false;
      restartBtn.classList.remove("is-visible");
      updateHintUi();
      answerInput.focus();
    }

    hintBtn.addEventListener("click", requestHint);
    restartBtn.addEventListener("click", resetQuiz);
    composerForm.addEventListener("submit", function (e) {
      e.preventDefault();
      const text = answerInput.value.trim();
      if (!text) return;
      handleAnswer(text);
    });

    updateHintUi();
  })();
</script>
</body>
</html>
